<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de cadastro de aluno - Curso DSM</title>
</head>
<body>
    <h1>Cadastro de aluno - DSM</h1>
    <p>Esse formulário foi criado com a finalidade de receber os de dados de cadastro dos alunos de DSM</p>

    <form action="Cadastro-finalizado.html" method="post">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <label for="nome">Nome Completo:</label>
            <br>
            <input type="text" name="nome" id="nome" placeholder="Insira seu nome completo" required>
            <br><br>
            <label for="email">E-mail:</label>
            <br>
            <input type="email" name="email" id="email" placeholder="exemplo@email.com" required>
            <br><br>
            <label for="Nascimento">Data de Nascimento:></label>
            <br>
            <input type="date" name="nascimento" id="nacimento" required>
        </fieldset>
        <br><br><br>
        <fieldset>
            <legend>Dados Acadêmicos</legend>
            <label for="curso">Curso:</label>
            <br>
            <select name="curso" id="curso">
                <option value="dsm">DSM</option>
                <option value="ge">GE</option>
                <option value="adm">ADM</option>
            </select>
            <br><br>
            <label for="periodo">Período:</label>
            <br>
            <input type="radio" value="manha" name="periodo">Manhã
            <input type="radio" value="noite" name="periodo">Noite
            <br><br>
            <label for="observações">Observações:</label>
            <br>
            <textarea name="observações" id="observações" cols="40" rows="4"></textarea>
        </fieldset>
            <br><br><br>
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
    </form>
</body>
</html>
